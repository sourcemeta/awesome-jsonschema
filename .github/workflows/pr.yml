name: Test
on: pull_request
jobs:
  pr:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm start
      - name: Check that there are no uncommitted changes
        run: ./.github/no-staged-uncommitted-files.sh
