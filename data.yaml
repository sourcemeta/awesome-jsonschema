- name: "Validation of Modern JSON Schema: Formalization and Complexity"
  url: https://arxiv.org/abs/2307.10034
  description: >-
    In this paper, we give the first formal description of Modern JSON Schema, which we consider a
    central contribution of the work that we present here. We then prove that its data validation
    problem is PSPACE-complete. We prove that the origin of the problem lies in dynamic references,
    and not in annotation-dependent validation. We study the schema and data complexities, showing
    that the problem is PSPACE-complete with respect to the schema size even with a fixed instance,
    but is in PTIME when the schema is fixed and only the instance size is allowed to vary. Finally,
    we run experiments that show that there are families of schemas where the difference in
    asymptotic complexity between dynamic and static references is extremely visible, even with
    small schemas.
  type: Papers
  level: advanced
  year: 2024
- name: Machine actionable metadata models
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9525592/
  description: This paper discussed the use of JSON Schema to define human and machine readable metadata models
  type: Papers
  level: advanced
  year: 2022
- name: "Blaze: Compiling JSON Schema for 10x Faster Validation"
  url: https://arxiv.org/abs/2503.02770
  description: >-
    This paper introduces Blaze, a JSON Schema validator compiles complex schemas to an efficient
    representation in seconds to minutes, adding minimal overhead at build time. Blaze incorporates
    several unique optimizations to reduce the validation time by an average of approximately 10x
    compared existing validators on a variety of datasets. In some cases, Blaze achieves a reduction
    in validation time of multiple orders of magnitude compared to the next fastest validator. We
    also demonstrate that several popular validators produce incorrect results in some cases, while
    Blaze maintains strict adherence to the JSON Schema specification.
  type: Papers
  level: advanced
  year: 2025
- name: "JSONSchemaBench: A Rigorous Benchmark of Structured Outputs for Language Models"
  url: https://arxiv.org/abs/2501.10868
  description: >-
    This paper introduces JSONSchemaBench, a benchmark for constrained decoding comprising 10K
    real-world JSON schemas that encompass a wide range of constraints with varying complexity. We
    pair the benchmark with the existing official JSON Schema Test Suite and evaluate six
    state-of-the-art constrained decoding frameworks, including Guidance, Outlines, Llamacpp,
    XGrammar, OpenAI, and Gemini. Through extensive experiments, we gain insights into the
    capabilities and limitations of constrained decoding on structured generation with real-world
    JSON schemas.
  type: Papers
  level: advanced
  year: 2025
- name: Elimination of annotation dependencies in validation for Modern JSON Schema
  url: https://arxiv.org/abs/2503.11288
  description: >-
    This paper proves that the elimination of annotation dependent keywords cannot, in general,
    avoid an exponential increase of the schema dimension. We provide an algorithm to eliminate
    these keywords that, despite the theoretical lower bound, behaves quite well in practice, as we
    verify with an extensive set of experiments.
  type: Papers
  level: advanced
  year: 2025
- name: Negation-Closure for JSON Schema
  url: https://arxiv.org/abs/2202.13434
  description: >-
    Examines how JSON Schema handles negation, demonstrates that the language lacks negation
    closure, explores how recent schema drafts address this limitation, and proposes enrichments to
    the language. Includes an algebraic reformulation of JSON Schema and a prototype system for
    generating schema witnesses
  type: Papers
  level: advanced
  year: 2022
- name: In 76% of modern OpenAPI specs, JSON Schema dominates the specification
  url: https://www.sourcemeta.com/blog/json-schema-dominates-openapi/
  description: >-
    An empirical analysis of 4,127 real-world OpenAPI specifications showing that JSON Schema makes
    up the majority of content in three-quarters of modern API documents, with the schema layer
    growing more dominant as APIs mature
