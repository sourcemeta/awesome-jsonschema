    link services to assemblies of components that describe computations. Hence a top-down
    development process that keeps model and implementation aligned
  type: Papers
  level: advanced
  year: 2018
- name: Foundations of JSON Schema
  url: https://dl.acm.org/doi/abs/10.1145/2872427.2883029
