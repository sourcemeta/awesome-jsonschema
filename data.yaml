    use it to show that implementing this layer on top of JSON is feasible in practice
  type: Papers
  level: advanced
  year: 2016
- name: >-
    User profile integration made easy: model-driven extraction and transformation of social network
    schemas
  url: https://dl.acm.org/doi/abs/10.1145/2187980.2188227
  description: >-
    This paper presents, firstly, a semi-automatic approach to extract schema information from
    instance data. Secondly, transformations of the derived schemas to different technical spaces
    are utilized, thereby allowing, amongst other benefits, the application of established
    integration tools and methods. Finally, as a case study, schemas are derived for Facebook,
    Google+, and LinkedIn
