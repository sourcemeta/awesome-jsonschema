- name: The Usage of Negation in Real-World JSON Schema Documents
  url: http://bilioso.isti.cnr.it/sebd2022/preprint/SEBD_2022_Camera-ready_PDF_8.pdf
  description: >-
    Many software tools, but also formal frameworks for working with JSON Schema, do not fully
    support negation. This motivates us to study whether negation is actually used in practice, for
    which aims, and whether it could, in principle, be replaced by simpler operators. We have
    collected a large corpus of 80k open source JSON Schema documents. We perform a systematic
    analysis, quantify usage patterns of negation, and also qualitatively analyze schemas. We show
    that negation is indeed used, albeit infrequently, following a stable set of patterns
  type: Papers
  level: advanced
  year: 2022
