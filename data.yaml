- name: Type Safety with JSON Subschema
  url: https://arxiv.org/abs/1911.12651
  description: >-
    Deciding whether one schema is a subschema of another is non-trivial because of the richness of
    the JSON Schema specification language. Given a pair of schemas, our approach first
    canonicalizes and simplifies both schemas, then decides the subschema question on the canonical
    forms, dispatching simpler subschema queries to type-specific checkers
  type: Papers
  level: advanced
  year: 2020
- name: Witness Generation for JSON Schema
  url: https://arxiv.org/abs/2202.12849
  description: >-
    JSON Schema is an important, evolving standard schema language for families of JSON documents.
    It is based on a complex combination of structural and Boolean assertions, and features negation
    and recursion. The static analysis of JSON Schema documents comprises practically relevant
    problems, including schema satisfiability, inclusion, and equivalence. These three problems can
    be reduced to witness generation: given a schema, generate an element of the schema, if it
    exists, and report failure otherwise
  type: Papers
  level: advanced
  year: 2022
- name: What Are Real JSON Schemas Like?
  url: https://link.springer.com/chapter/10.1007/978-3-030-34146-6_9
  description: >-
    A first empirical analysis of a curated collection of real-world JSON Schemas. Knowing what real
    JSON Schemas are like (to borrow from a title of a related study on DTDs) helps practitioners
    and researchers in making realistic assumptions when building tools for JSON Schema processing
  type: Papers
  level: advanced
  year: 2019
- name: Challenges in Checking JSON Schema Containment over Evolving Real-World Schemas
  url: https://link.springer.com/chapter/10.1007/978-3-030-65847-2_20
  description: >-
    This paper presents the results of an empirical study of the first generation of tools for
    checking JSON Schema containment which is applied to a diverse collection of over 230 real-world
    schemas and their altogether 1k historic versions
  type: Papers
  level: advanced
  year: 2020
- name: Schema Inference for Massive JSON Datasets
  url: https://hal.archives-ouvertes.fr/hal-01491765
  description: >-
    Recent years have seen the widespread use of JSON as a data format to represent massive data
    collections. JSON data collections are usually schemaless. While this ensures several
    advantages, the absence of schema information has important negative consequences: the
    correctness of complex queries and programs cannot be statically checked, users cannot rely on
    schema information to quickly figure out structural properties that could speed up the
    formulation of correct queries, and many schema-based optimizations are not possible. In this
    paper we deal with the problem of inferring a schema from massive JSON data sets
  type: Papers
  level: advanced
  year: 2017
- name: JSON Schema Inference Approaches
  url: https://link.springer.com/chapter/10.1007/978-3-030-65847-2_16
  description: >-
    In the context of document NoSQL databases, namely those assuming the JSON data format, this
    paper focuses on several representatives of the existing inference approaches and provide their
    thorough comparison
  type: Papers
  level: advanced
  year: 2020
- name: Top-Down Model-Driven Engineering of Web Services from Extended OpenAPI Models
  url: https://ieeexplore.ieee.org/abstract/document/9000020
  description: >-
