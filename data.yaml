  level: advanced
  year: 2012
- name: Example-Driven Web API Specification Discovery
  url: https://link.springer.com/chapter/10.1007/978-3-319-61482-3_16
  description: >-
    In this paper we present an example-driven discovery process that generates model-based OpenAPI
    specifications for REST Web APIs by using API call examples. A tool implementing our approach
    and a community-driven repository for the discovered APIs are also presented
  type: Papers
  level: advanced
  year: 2017
- name: "Jsongen: a quickcheck based library for testing JSON web services"
  url: https://dl.acm.org/doi/abs/10.1145/2633448.2633454
  description: >-
    This article describes a systematic approach to testing behavioural aspects of Web Services that
    communicate using the JSON data format. To generate random JSON data for populating tests we
    have developed a new library, jsongen, which given a characterisation of the JSON data as a JSON
    schema, (i) automatically derives a QuickCheck generator which can generate an infinite number
    of JSON values that validate against the schema, and (ii) provides a generic QuickCheck state
    machine which is capable of following the (hyper)links documented in the JSON schema, to
    automatically explore the web service
  type: Papers
  level: advanced
  year: 2014
- name: An Approach for Schema Extraction of JSON and Extended JSON Document Collections
  url: https://ieeexplore.ieee.org/abstract/document/8424731
  description: >-
    This paper presents an approach that extracts a schema from a JSON or Extended JSON document
    collection stored in a NoSQL document-oriented database or other document repository.
    Aggregation operations are considered in order to obtain a schema for each distinct structure in
    the collection, and a hierarchical data structure is proposed to group these schemas in order to
    generate a global schema in JSON Schema format
  type: Papers
  level: advanced
  year: 2018
- name: Schema extraction and structural outlier detection for JSON-based nosql data stores
